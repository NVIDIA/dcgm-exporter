version: 2
metrics:
  - name: gpu
    fields:
      - name: DCGM_FI_DEV_GPU_TEMP_CELSIUS
        prometheus_type: gauge
        help: GPU temperature.
      - name: DCGM_FI_DEV_BOARD_POWER_WATTS
        prometheus_type: gauge
        help: Power draw.
    overrides:
      - name: nothing
        match: [DCGM_FI_DEV_NOT_A_CONFIGURED_FIELD]
        every: 1s
outputs:
  prometheus:
    type: prometheus
    schema: dcgm/v1

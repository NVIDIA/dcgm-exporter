# Scans commits for secrets with gitleaks, the rules in .gitleaks.toml and the
# reviewed findings in .gitleaksignore. A pull request scans its own commits
# with both files from the current tip of its base branch, so it cannot add
# its own allowance;
# pushes and the weekly run scan the whole history with the files from the
# pushed or latest commit.

name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSLf -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # reviewed_file writes file $2 as it is in commit $1 to $3, or $4
          # when that commit has no such file; any other git error fails.
          reviewed_file() {
            if git cat-file -e "$1:$2" 2>/dev/null; then
              git show "$1:$2" >"$3"
              return
            fi
            git cat-file -e "$1^{commit}"
            printf '%s' "$4" >"$3"
          }

          # A pull request scans its own commits with the rules from the
          # current tip of its base branch, which the full-history checkout
          # fetched; a push or the weekly run scans the history of the commit.
          commits="${GITHUB_SHA}"
          rules_commit="${GITHUB_SHA}"
          if [[ -n "${BASE_REF}" ]]; then
            git check-ref-format "refs/heads/${BASE_REF}"
            rules_commit="$(git rev-parse --verify "refs/remotes/origin/${BASE_REF}^{commit}")"
            commits="$(git merge-base "${HEAD_SHA}" "${rules_commit}")..${HEAD_SHA}"
          fi

          rules_dir="$(mktemp -d)"
          reviewed_file "${rules_commit}" .gitleaks.toml "${rules_dir}/gitleaks.toml" $'[extend]\nuseDefault = true\n'
          reviewed_file "${rules_commit}" .gitleaksignore "${rules_dir}/gitleaksignore" ''
          # gitleaks reads .gitleaksignore from the checkout even when given
          # another file, and the change under scan controls the checkout.
          rm -f .gitleaks.toml .gitleaksignore

          gitleaks detect --source . --redact --no-banner --exit-code 1 --ignore-gitleaks-allow \
            --config "${rules_dir}/gitleaks.toml" \
            --gitleaks-ignore-path "${rules_dir}/gitleaksignore" \
            --log-opts "${commits}"

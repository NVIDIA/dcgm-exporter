apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "dcgm-exporter.fullname" . }}
  namespace: {{ include "dcgm-exporter.namespace" . }}
  labels:
    {{- include "dcgm-exporter.labels" . | nindent 4 }}
  {{- with .Values.daemonSetAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- include "dcgm-exporter.validateValues" . }}
{{- /* The config file the chart creates, if any; with configMap.existingName the chart mounts that ConfigMap instead. */}}
{{- $configFile := include "dcgm-exporter.configFile" . }}
{{- $configMap := include "dcgm-exporter.configMap" . | fromJson }}
{{- $mountConfig := or $configFile $configMap.existingName }}
{{- /* The debug dump directory that gets the chart's emptyDir, if any. */}}
{{- $dumpDirectory := include "dcgm-exporter.dumpVolumeDirectory" . }}
spec:
  updateStrategy:
    type: RollingUpdate
    {{- with .Values.rollingUpdate }}
    rollingUpdate:
      maxUnavailable: {{ .maxUnavailable }}
      maxSurge: {{ .maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "dcgm-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dcgm-exporter.selectorLabels" . | nindent 8 }}
      {{- if .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
      {{- end }}
      {{- if or .Values.podAnnotations $configFile }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $configFile }}
        {{- /*
        The exporter reads its config file only at startup, so a changed
        chart-managed config changes this checksum and rolls the pods. The
        metrics list needs no checksum: the running exporter reloads it.
        */}}
        checksum/config: {{ $configFile | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      hostPID: {{ .Values.hostPID | default false }}
      {{- if .Values.hostNetwork }}
      hostNetwork: {{ .Values.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dcgm-exporter.serviceAccountName" . }}
      automountServiceAccountToken: {{ include "dcgm-exporter.automountServiceAccountToken" . }}
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      volumes:
      - name: "pod-gpu-resources"
        hostPath:
          path: {{ .Values.kubeletPath }}
      {{- if .Values.tlsServerConfig.enabled }}
      - name: "tls"
        secret:
          secretName: {{ include "dcgm-exporter.tlsCertsSecretName" . }}
          defaultMode: 0664
      {{- end }}
      {{- if include "dcgm-exporter.webConfigEnabled" . }}
      - name: "web-config-yaml"
        secret:
          secretName: {{ include "dcgm-exporter.webConfigSecretName" . }}
          defaultMode: 0664
      {{- end }}
      {{- if $mountConfig }}
      - name: "dcgm-exporter-config"
        configMap:
          name: {{ $configMap.existingName | default (printf "%s-config" (include "dcgm-exporter.fullname" .)) }}
          {{- /* Only the config file: other keys of a configMap.existingName ConfigMap stay out of the pod. */}}
          items:
          - key: {{ $configMap.key | quote }}
            path: {{ $configMap.key | quote }}
          defaultMode: 0664
      {{- end }}
      - name: "dcgm-exporter-metrics"
        configMap:
          name: {{ include "dcgm-exporter.metricsConfigMapName" . }}
          items:
          - key: metrics
            path: {{ include "dcgm-exporter.metricsFilePath" . | base }}
      {{- range .Values.extraHostVolumes }}
      - name: {{ .name | quote }}
        hostPath:
          path: {{ .hostPath | quote }}
      {{- end }}
      {{- with .Values.extraConfigMapVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if $dumpDirectory }}
      - name: "debug-dumps"
        emptyDir:
          sizeLimit: {{ .Values.debugDump.sizeLimit | quote }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: exporter
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        {{- if .Values.image.digest }}
        image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
        {{- else if .Values.image.tag }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        {{- else }}
        image: "{{ .Values.image.repository }}:{{ .Chart.AppVersion }}"
        {{- end }}
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
        {{- with .Values.arguments }}
        args:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        {{- if $mountConfig }}
        - name: "DCGM_EXPORTER_CONFIG_FILE"
          value: {{ include "dcgm-exporter.configFilePath" . | quote }}
        {{- end }}
        {{- if .Values.extraEnv }}
        {{- toYaml .Values.extraEnv | nindent 8 }}
        {{- end }}
        ports:
        - name: "metrics"
          containerPort: {{ .Values.service.port }}
        volumeMounts:
        - name: "pod-gpu-resources"
          readOnly: true
          mountPath: "/var/lib/kubelet/pod-resources"
        {{- if .Values.tlsServerConfig.enabled }}
        - name: "tls"
          mountPath: /etc/dcgm-exporter/tls
        {{- end }}
        {{- /* Chart files are whole-directory mounts without subPath, so the kubelet keeps them current. */}}
        {{- if include "dcgm-exporter.webConfigEnabled" . }}
        - name: "web-config-yaml"
          mountPath: {{ include "dcgm-exporter.webConfigPath" . | dir | quote }}
        {{- end }}
        {{- if $mountConfig }}
        - name: "dcgm-exporter-config"
          mountPath: {{ include "dcgm-exporter.configFilePath" . | dir | quote }}
        {{- end }}
        - name: "dcgm-exporter-metrics"
          mountPath: {{ include "dcgm-exporter.metricsFilePath" . | dir | quote }}
          readOnly: true
        {{- if .Values.extraVolumeMounts }}
        {{- toYaml .Values.extraVolumeMounts | nindent 8 }}
        {{- end }}
        {{- if $dumpDirectory }}
        - name: "debug-dumps"
          mountPath: {{ $dumpDirectory | quote }}
        {{- end }}
        {{- if and .Values.startupProbe .Values.startupProbe.enabled }}
        startupProbe:
          {{- if not $.Values.basicAuth.users }}
          httpGet:
            path: /health
            port: {{ .Values.service.port }}
            scheme: {{ ternary "HTTPS" "HTTP" $.Values.tlsServerConfig.enabled }}
          {{- else }}
          tcpSocket:
            port: {{ .Values.service.port }}
          {{- end }}
          periodSeconds: {{ .Values.startupProbe.periodSeconds | default 5 }}
          failureThreshold: {{ .Values.startupProbe.failureThreshold | default 60 }}
          {{- with .Values.startupProbe.timeoutSeconds }}
          timeoutSeconds: {{ . }}
          {{- end }}
        {{- end }}
        livenessProbe:
          {{- if not $.Values.basicAuth.users }}
          httpGet:
            path: /health
            port: {{ .Values.service.port }}
            scheme: {{ ternary "HTTPS" "HTTP" $.Values.tlsServerConfig.enabled }}
          {{- else }}
          tcpSocket:
            port: {{ .Values.service.port }}
          {{- end }}
          {{- include "dcgm-exporter.probeInitialDelay" (dict "probe" .Values.livenessProbe "root" $) | nindent 10 }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          {{- if hasKey .Values.livenessProbe "timeoutSeconds" }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          {{- end }}
          {{- if hasKey .Values.livenessProbe "failureThreshold" }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
        readinessProbe:
          {{- if not $.Values.basicAuth.users }}
          httpGet:
            path: /health
            port: {{ .Values.service.port }}
            scheme: {{ ternary "HTTPS" "HTTP" $.Values.tlsServerConfig.enabled }}
          {{- else }}
          tcpSocket:
            port: {{ .Values.service.port }}
          {{- end }}
          {{- include "dcgm-exporter.probeInitialDelay" (dict "probe" .Values.readinessProbe "root" $) | nindent 10 }}
          {{- if hasKey .Values.readinessProbe "periodSeconds" }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- end }}
          {{- if hasKey .Values.readinessProbe "timeoutSeconds" }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          {{- end }}
          {{- if hasKey .Values.readinessProbe "failureThreshold" }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}

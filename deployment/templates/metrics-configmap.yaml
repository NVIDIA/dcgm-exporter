apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dcgm-exporter.metricsConfigMapName" . }}
  namespace: {{ include "dcgm-exporter.namespace" . }}
  labels:
    {{- include "dcgm-exporter.labels" . | nindent 4 }}
data:
{{- if .Values.customMetrics }}
  metrics: |
{{- .Values.customMetrics | nindent 4 }}
{{- else }}
  metrics: |
{{- $defaultMetrics := .Files.Get "files/default-counters.csv" }}
{{- if eq (trim $defaultMetrics) "../../etc/default-counters.csv" }}
{{- fail "source-chart defaults need symlink support; run 'task helm:package' to build a self-contained chart" }}
{{- end }}
{{- $defaultMetrics | required "chart is missing files/default-counters.csv; run 'task helm:package' to build a self-contained chart" | nindent 4 }}
{{- end }}
